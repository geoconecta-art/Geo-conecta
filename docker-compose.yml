services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    # 👇 AGREGA ESTA LÍNEA EXACTAMENTE AQUÍ 👇
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27018:27017"
    volumes:
      - ./data/db:/data/db